# Machine-readable license map (https://reuse.software/spec-3.3/). Mirrors LICENSE.md;
# checked by `make reuse` (reuse lint). A file-level SPDX header overrides these defaults.
version = 1
SPDX-PackageName = "OM"
SPDX-PackageSupplier = "SeedLife / lonunjie (https://lonunjie.org)"
SPDX-PackageDownloadLocation = "https://github.com/lonunjie/om"

[[annotations]]
path = ["**/*.md", "docs/**", "decisions/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "OM contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["packages/**", "apps/**", "crates/**", "infra/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "OM contributors"
SPDX-License-Identifier = "MPL-2.0"

# Reference relay (Home), provisioning and network-service code is AGPL-3.0-or-later (LICENSING_AND_CONTRIBUTION_POLICY.md section 1): the reference Home, the relay deploy template and its builder.
[[annotations]]
path = ["infra/cloudflare-home/**"]
precedence = "override"
SPDX-FileCopyrightText = "OM contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "package.json", "pnpm-workspace.yaml", "pnpm-lock.yaml", "tsconfig.json", "tsconfig.base.json", "eslint.config.js", "eslint.policy.js", "eslint.policy.d.ts", "vitest.config.ts"]
precedence = "aggregate"
SPDX-FileCopyrightText = "OM contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["spec/**", "machine/**", "verification/**", "tools/**", "deploy/ledger/**", "Makefile", ".github/**", "REUSE.toml", ".gitignore", "docs/ux-design/**/*.json", "docs/ux-design/prototype/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "OM contributors"
SPDX-License-Identifier = "Apache-2.0"
