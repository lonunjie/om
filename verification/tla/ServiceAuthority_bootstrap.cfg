\* V-011: service with a Room role and its endpoints try to approve their own control changes.
CONSTANTS
  Accounts = {"a", "b"}
  Endpoints = {"e1", "e2"}
  FirstEp = "e1"
  Host <- HostOf
  Recipients = {"r1", "r2"}
  Menu <- MenuBootstrap
  InitCtrl = {"a", "b"}
  InitThr = 1
  MaxSteps = 5
  MaxVersion = 2
  Mutation = "none"
SPECIFICATION Spec
INVARIANTS
  NoSelfBootstrap
  HostNeverController
  AcceptedOnlyActive
  NoHiddenRecipient
  AliasNoTrustTransfer
  RevocationNeverStranded
PROPERTIES
  NoRollback
  RevocationDominates
  RevocationNotBlocked
