\* V-003 passing configuration: every session-manager rule (K1..K10) enabled.
\* Gap configurations (one rule disabled each) are generated by
\* verification/prototypes/v003-sessions/run.sh and must each yield a counterexample.
SPECIFICATION Spec
CONSTANTS
  Senders = {"a1", "b1"}
  MaxMsgs = 2
  MaxSid = 4
  MaxCrash = 1
  MaxRestore = 0
  MaxDup = 1
  MaxWeak = 1
  MaxInject = 1
  PersistBeforeSend = TRUE
  DedupeDurable = TRUE
  FloorFromACS = TRUE
  RetryOnReset = TRUE
  RecheckOnEncrypt = TRUE
  ValidateAgainstACS = TRUE
  ReconcileControlHead = TRUE
  RestoreDropsSessions = TRUE
  RejectFromRevoked = TRUE
  PrekeyUntilConfirmed = TRUE
CONSTRAINT StateBound
INVARIANTS
  TypeOK
  NoDoubleAccept
  NoKeyReuse
  NoSendToIneligible
  NoAcceptFromKnownRevoked
  NoSilentDowngrade
  DeliveredAtQuiescence
  SamePreferredAtQuiescence
