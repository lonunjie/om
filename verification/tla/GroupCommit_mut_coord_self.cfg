\* V-004 mutation coord_self: the coordinator may sequence its own removal; TLC must find a counterexample.
CONSTANTS
  Members = {"a", "b", "c"}
  Succ <- SuccS
  Faulty = {"a"}
  Intents <- IntentsRace
  MaxPub = 1
  AllowNop = TRUE
  AllowReplace = TRUE
  Mutation = "coord_self"
SPECIFICATION Spec
INVARIANTS
  TypeOK
  OnlyValidMerged
  NoHonestSelfEquivocation
  ActiveInRoster
  ReductionOutranksNonReduction
  CoordinatorNeverSequencesSelf
PROPERTY
  EventuallyConverged
