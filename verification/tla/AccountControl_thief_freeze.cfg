\* ADR-0168 F-14: with freeze resolution able to revoke and to count a co-signed recovery vote, a thief holding one of
\* two devices and no recovery method never owns the account (static owner device set, so only the thief's
\* quarantine/resolution power is exercised; the owner escape is the trap_thief_freeze golden vector).
CONSTANTS
  HonestInit = {"h1", "h2"}
  HonestSpare = {}
  AttackerDevs = {"x1"}
  CanCompromise = {"h1"}
  AttackerMethods = 0
  OwnerMethods = 1
  Delay = 2
  LegacyWait = 2
  MaxGen = 3
  OwnerStructural = FALSE
  OwnerMayGoOffline = TRUE
  AttackerMayRecover = FALSE
  OwnerKeepsOneLive = TRUE
  MethodCountMutation = FALSE
INIT Init
NEXT Next
CONSTRAINT StateBound
INVARIANTS
  TypeOK
  RevokedNeverController
  ControllersNonEmpty
  SomeVotingController
  NoSilentLink
  PendingEpochSane
  AttackerNeverOwns
PROPERTIES
  NoRollback
  FreezeExitOnlyByResolve
