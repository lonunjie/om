\* V-011: host migration e1(hostA)->e2(hostB) under 2-of-2 controllers, lagging recipients, alias recycling.
CONSTANTS
  Accounts = {"a", "b"}
  Endpoints = {"e1", "e2"}
  FirstEp = "e1"
  Host <- HostOf
  Recipients = {"r1", "r2"}
  Menu <- MenuMigrate
  InitCtrl = {"a", "b"}
  InitThr = 2
  MaxSteps = 6
  MaxVersion = 2
  Mutation = "none"
SPECIFICATION Spec
INVARIANTS
  NoSelfBootstrap
  HostNeverController
  AcceptedOnlyActive
  NoHiddenRecipient
  AliasNoTrustTransfer
  RevocationNeverStranded
PROPERTIES
  NoRollback
  RevocationDominates
  RevocationNotBlocked
