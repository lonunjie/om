# Feasibility prototype for V-004. Not product code. Not for production.
[package]
name = "om-v004-mls-ordering"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []

[dependencies]
openmls = { version = "=0.9.0", features = ["fork-resolution"] }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
serde_json = "1"

[profile.release]
opt-level = 2

# OpenMLS needs JS APIs (secure randomness, time) on every wasm32 target; the PWA target is
# wasm32-unknown-unknown in a JS host, driven here through wasm-bindgen under Node.
[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "=0.9.0", features = ["fork-resolution", "js"] }
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
