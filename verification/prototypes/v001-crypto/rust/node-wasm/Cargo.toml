[package]
name = "om-v001-node-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "wasm32-unknown-unknown benchmark/selftest entry points for Node (V8). Not for production."

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
om-v001-proto = { path = "../core", features = ["insecure-test-rng"] }
# spqr pulls rand 0.9 -> getrandom 0.3; on wasm32-unknown-unknown we supply the host's
# crypto.getRandomValues through getrandom's documented "custom" backend.
getrandom = "0.3"
serde_json = "1"
