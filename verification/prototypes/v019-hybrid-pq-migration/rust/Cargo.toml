# Feasibility prototype for V-019. Not product code. Not for production.
[package]
name = "om-v019-hybrid-pq-migration"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []

[dependencies]
openmls = { version = "=0.9.0", features = ["fork-resolution", "draft-ietf-mls-pq-ciphersuites"] }
openmls_rust_crypto = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "=0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2

# OpenMLS needs JS APIs (secure randomness, time) on every wasm32 target; the PWA target is
# wasm32-unknown-unknown in a JS host, driven here through wasm-bindgen under Node.
[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "=0.9.0", features = ["fork-resolution", "draft-ietf-mls-pq-ciphersuites", "js"] }
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
