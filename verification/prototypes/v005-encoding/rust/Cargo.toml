# Feasibility prototype for V-005. Not product code. Not for production.
[package]
name = "om-v005-cbor"
version = "0.0.0"
edition = "2021"
publish = false
license = "MPL-2.0"
description = "V-005 feasibility prototype: independent OM-CBOR-v1 strict codec and W0 object validator"

[dependencies]
serde_json = "=1.0.145"
sha2 = { version = "=0.10.9", default-features = false }

[[bin]]
name = "v005"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
