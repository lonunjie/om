[package]
name = "omarchive"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Feasibility prototype for V-014 (om-archive-v1 reader/writer). Not product code. Not for production."

[dependencies]
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
ed25519-dalek = "2"
crc32fast = "1"
getrandom = "0.2"

[dev-dependencies]

[features]
default = []

[[bin]]
name = "omarchive-corpus"
path = "src/bin/omarchive-corpus.rs"

[profile.release]
debug = false
