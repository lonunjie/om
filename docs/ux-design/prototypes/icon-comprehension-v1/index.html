<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OM icon comprehension v1</title><style>body{font:16px system-ui;background:#f7f9fc;color:#172033;margin:0}main{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #d9e0ea;border-radius:20px;padding:24px}.icon{width:96px;height:96px;margin:24px auto;color:#172033}.icon svg{width:100%;height:100%}textarea{width:100%;min-height:100px;padding:10px;font:inherit}button{min-height:44px;padding:10px 15px;border-radius:12px;border:1px solid #ccd4df;background:white}.primary{background:#0067c5;color:white}.row{display:flex;gap:10px;flex-wrap:wrap}.small{color:#5b6575;font-size:14px}</style></head><body><main><h1>OM functional icon comprehension v1</h1><p>Meaning is hidden until you answer. Results remain local until export.</p><section class=card id=card></section><div class=row style="margin-top:14px"><button id=prev>Back</button><button id=next class=primary>Next</button><button id=export>Export JSON</button><button id=reset>Reset</button></div></main><script>

roke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><circle cx=\"10.5\" cy=\"10.5\" r=\"5.5\"/><line x1=\"15\" y1=\"15\" x2=\"20\" y2=\"20\"/></svg>\n"};const labels={"omni": "Omnibar", "spaces": "Spaces", "reply": "Reply", "forward-message": "Forward message", "archive": "Archive", "mute": "Mute", "pin": "Pin", "verify": "Verify identity", "device": "Device", "recovery": "Recovery", "pending": "Pending", "delivered": "Delivered", "read": "Read", "retry": "Retry", "qr-scan": "Scan QR code", "invite": "Invite", "call": "Voice call", "video-call": "Video call", "attach": "Attach", "search": "Search"};const order=Object.keys(icons);let d=JSON.parse(localStorage.getItem('om-icons-v1')||'null')||{participant:crypto.randomUUID(),order:[...order].sort(()=>Math.random()-.5),i:0,responses:{}};function save(){localStorage.setItem('om-icons-v1',JSON.stringify(d))}function render(){let id=d.order[d.i],r=d.responses[id]||{};document.querySelector('#card').innerHTML=`<div class=small>${d.i+1} / ${d.order.length}</div><div class=icon>${icons[id]}</div><label>What do you think this means?</label><textarea id=meaning>${r.meaning||''}</textarea><label>Confidence (1–5)</label><div class=row>${[1,2,3,4,5].map(n=>`<button data-n=${n} aria-pressed=${r.confidence===n}>${n}</button>`).join('')}</div><button id=reveal style="margin-top:16px">Reveal intended meaning</button><div id=intended class=small style="margin-top:10px">${r.revealed?'Intended: '+labels[id]:''}</div>`;document.querySelector('#meaning').oninput=e=>{r.meaning=e.target.value;d.responses[id]=r;save()};document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{r.confidence=+b.dataset.n;d.responses[id]=r;save();render()});document.querySelector('#reveal').onclick=()=>{r.revealed=true;d.responses[id]=r;save();render()}}document.querySelector('#next').onclick=()=>{d.i=Math.min(d.order.length-1,d.i+1);save();render()};document.querySelector('
