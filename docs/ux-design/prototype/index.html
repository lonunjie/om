<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OM conversation-first shell prototype</title>
<style>
:root{color-scheme:light dark;--canvas:#f7f8fa;--surface:#fff;--subtle:#eef0f3;--text:#16181d;--muted:#5d6470;--line:#dde1e6;--accent:#2459d3;--accent-on:#fff;--own:#dde7ff;--danger:#b42318;--radius:14px}
@media(prefers-color-scheme:dark){:root{--canvas:#111318;--surface:#181b21;--subtle:#242830;--text:#f5f7fa;--muted:#b9c0cc;--line:#303640;--accent:#7ea2ff;--accent-on:#111318;--own:#243b6b;--danger:#ff8a84}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--canvas);color:var(--text);overflow:hidden}button,input,textarea{font:inherit;color:inherit}.app{height:100dvh;display:grid;grid-template-columns:minmax(290px,350px) minmax(0,1fr) 300px;background:var(--surface)}
.listpane{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:var(--surface)}.top{padding:12px 14px 8px;display:flex;align-items:center;gap:9px}.brand{font-weight:850;font-size:22px;color:var(--accent)}.grow{flex:1}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--subtle);font-weight:700;border:0}.new{width:40px;height:40px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-on);font-weight:800;cursor:pointer}.omnibox{margin:0 14px 8px;position:relative}.omnibox input{width:100%;height:44px;border:1px solid var(--line);border-radius:14px;background:var(--subtle);padding:0 13px;outline:none}.omnibox input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.suggestions{margin-top:7px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}.suggestion{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:10px;text-align:left;padding:9px 11px;cursor:pointer}.suggestion:hover,.suggestion:focus-visible{background:var(--subtle)}.tag{font-size:11px;color:var(--muted);margin-left:auto}.sectionlabel{padding:8px 16px 4px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}.items{overflow:auto;padding:3px 8px 16px}.item{width:100%;border:0;background:transparent;border-radius:12px;padding:10px;display:grid;grid-template-columns:42px 1fr auto;gap:10px;text-align:left;cursor:pointer}.item:hover{background:var(--subtle)}.item.selected{background:color-mix(in srgb,var(--accent) 12%,var(--surface))}.item .avatar{width:42px;height:42px}.name{font-weight:680}.preview,.time,.sub{color:var(--muted);font-size:13px}
.detail{display:flex;flex-direction:column;min-width:0;background:var(--surface)}.chathead{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:10px}.icon{min-width:44px;min-height:44px;border:0;border-radius:12px;background:transparent;cursor:pointer}.icon:hover{background:var(--subtle)}.messages{flex:1;overflow:auto;padding:24px max(18px,6vw);display:flex;flex-direction:column;gap:7px}.bubble{max-width:min(70%,620px);padding:9px 12px;border-radius:15px;background:var(--subtle)}.mine{align-self:flex-end;background:var(--own)}.other{align-self:flex-start}.composewrap{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:7px;align-items:end}.composer{flex:1;min-height:44px;max-height:130px;border:1px solid var(--line);border-radius:17px;padding:11px 13px;background:var(--subtle);resize:none;outline:none}.send{min-width:44px;height:44px;border:0;border-radius:50%;background:var(--accent);color:var(--accent-on);font-weight:800;cursor:pointer}.inspector{border-left:1px solid var(--line);padding:24px 18px;background:var(--surface);overflow:auto}.profile{text-align:center}.profile .avatar{width:72px;height:72px;margin:0 auto 10px;font-size:22px}.row{padding:11px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}.mobileback{display:none}
@media(max-width:1199px){.app{grid-template-columns:minmax(290px,350px) minmax(0,1fr)}.inspector{display:none}}
@media(max-width:699px){.app{display:block}.listpane,.detail{height:100dvh;border:0}.detail{display:none}.detail.active{display:flex}.listpane.hidden-mobile{display:none}.mobileback{display:inline-grid}.messages{padding:18px 12px}.bubble{max-width:84%}.chathead{height:58px}}
@media(prefers-reduced-motion:no-preference){.item,.icon,.send,.suggestion{transition:background-color 140ms ease,transform 100ms ease}.send:active,.icon:active{transform:scale(.96)}.bubble{animation:appear 160ms ease-out}@keyframes appear{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="app">
  <section class="listpane" id="listpane">
    <header class="top"><div class="brand" aria-label="OM">OM</div><div class="grow"></div><button class="new" aria-label="New conversation">＋</button><button class="avatar" aria-label="Profile and settings">M</button></header>
    <div class="omnibox">
      <input id="omnibox" type="search" placeholder="People, chats, messages, actions…" aria-label="OM Omnibar" autocomplete="off">
      <div class="suggestions" id="suggestions" role="listbox" aria-label="Omnibar suggestions"></div>
    </div>
    <div class="sectionlabel">Conversations</div>
    <div class="items" id="items"></div>
  </section>

  <main class="detail" id="detail">
    <header class="chathead">
      <button class="icon mobileback" id="back" aria-label="Back">←</button>
      <div class="avatar" id="headAvatar">A</div>
      <div class="grow"><div class="name" id="headName">Alice</div><div class="sub">Online</div></div>
      <button class="icon" aria-label="Audio call">☎</button>
      <button class="icon" aria-label="Video call">▣</button>
    </header>
    <div class="messages" id="messages" aria-live="polite"></div>
    <div class="composewrap"><button class="icon" aria-label="Attach">＋</button><textarea class="composer" id="composer" rows="1" placeholder="Message Alice" aria-label="Message"></textarea><button class="send" id="send" aria-label="Send">↑</button></div>
  </main>

  <aside class="inspector" aria-label="Conversation details">
    <div class="profile"><div class="avatar">A</div><strong>Alice</strong><div class="sub">OM contact</div></div>
    <div class="row"><span>Media</span><span>24</span></div><div class="row"><span>Files</span><span>8</span></div><div class="row"><span>Notifications</span><span>On</span></div><div class="row"><span>Protection</span><span>Recommended</span></div>
  </aside>
</div>
<script>
const conversations=[
{name:'Alice',preview:'Are you free later?',time:'12:41',initial:'A'},
{name:'Family',preview:'Maj: Photo',time:'11:08',initial:'F'},
{name:'Bob',preview:'Sounds good.',time:'Tue',initial:'B'},
{name:'Carol',preview:'Shared Alice with you',time:'Mon',initial:'C'}];
const messages={Alice:[['other','The design feels really calm.'],['mine','That is exactly what I want.'],['other','Are you free later?']],Family:[['other','Dinner at 7?'],['mine','Works for me.']],Bob:[['mine','I sent the OM invite.'],['other','Sounds good.']],Carol:[['other','I shared Alice with you.']]};
const baseSuggestions=[['New message','Action'],['Missed calls','Local'],['People & requests','Local'],['Scan QR','Action'],['Appearance','Setting']];
let current='Alice'; const $=s=>document.querySelector(s);
function renderList(){const box=$('#items');box.innerHTML='';conversations.forEach(p=>{const b=document.createElement('button');b.className='item'+(p.name===current?' selected':'');b.innerHTML=`<span class="avatar">${p.initial}</span><span><span class="name">${p.name}</span><br><span class="preview">${p.preview}</span></span><span class="time">${p.time}</span>`;b.onclick=()=>{current=p.name;showChat()};box.append(b)})}
function renderMessages(){const box=$('#messages');box.innerHTML='';(messages[current]||[]).forEach(([who,text])=>{const d=document.createElement('div');d.className='bubble '+who;d.textContent=text;box.append(d)});box.scrollTop=box.scrollHeight}
function showChat(){ $('#headName').textContent=current;$('#headAvatar').textContent=current[0];$('#composer').placeholder='Message '+current;renderMessages();renderList();$('#detail').classList.add('active');$('#listpane').classList.add('hidden-mobile') }
function renderSuggestions(){const q=$('#omnibox').value.trim().toLowerCase();const rows=[];conversations.filter(x=>!q||x.name.toLowerCase().includes(q)).slice(0,3).forEach(x=>rows.push([x.name,'Conversation']));baseSuggestions.filter(x=>!q||x[0].toLowerCase().includes(q)).forEach(x=>rows.push(x));const box=$('#suggestions');box.innerHTML='';rows.slice(0,6).forEach(([label,kind])=>{const b=document.createElement('button');b.className='suggestion';b.setAttribute('role','option');b.innerHTML=`<span>${label}</span><span class="tag">${kind}</span>`; if(kind==='Conversation')b.onclick=()=>{current=label;showChat()}; box.append(b)})}
$('#omnibox').addEventListener('input',renderSuggestions);$('#back').onclick=()=>{$('#detail').classList.remove('active');$('#listpane').classList.remove('hidden-mobile')};$('#send').onclick=()=>{const t=$('#composer').value.trim();if(!t)return;(messages[current]??=[]).push(['mine',t]);$('#composer').value='';renderMessages()};$('#composer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#send').click()}});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#omnibox').focus()}});
renderList();renderMessages();renderSuggestions();if(innerWidth>=700)$('#detail').classList.add('active');
</script>
</body>
</html>
