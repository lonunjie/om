[package]
name = "om-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "OM Core: identity, sessions, canonical state machine (core_kernel). Sans-IO: storage and transport are host traits."

[lints]
workspace = true

[features]
default = []
# Seeded ChaCha20 RNG, selftests and vector generation. NEVER in a production build.
insecure-test-rng = ["dep:rand_chacha"]
# In-memory loopback transport/store for tests only. NEVER in a production build.
test-loopback = ["insecure-test-rng"]
# Marker a production build sets; combining it with a test-only feature is a compile error (R-072).
production = []
# The real MLS engine for ordinary groups: stock OpenMLS 0.9.0 behind `GroupCrypto` (groups/openmls.rs).
# DEPENDS ON ADR-0187, which is a proposed delegated draft, not accepted. Off by default; not part of `production`.
groups-openmls = ["dep:openmls", "dep:openmls_rust_crypto", "dep:openmls_basic_credential", "dep:openmls_traits"]

[dependencies]
libcrux-ml-kem = { version = "0.0.10", default-features = false, features = ["mlkem768"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
libcrux-ml-dsa = { version = "0.0.10", default-features = false, features = ["mldsa65"] }
sha3 = "0.12"
shake = "0.1"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
aes-gcm-siv = { version = "0.12.1", default-features = false, features = ["aes", "alloc"] }
zeroize = "1.9"
rand_core = { version = "0.9", features = ["os_rng"] }
rand_chacha = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
om-codec = { path = "../om-codec" }
# groups-openmls (ADR-0187, proposed): exact pins, V-004 feature set.
openmls = { version = "=0.9.0", optional = true, features = ["fork-resolution"] }
openmls_rust_crypto = { version = "=0.6.0", optional = true }
openmls_basic_credential = { version = "=0.6.0", optional = true }
openmls_traits = { version = "=0.6.0", optional = true }

# OpenMLS refuses wasm unless `js` is on; with the workspace `[patch.crates-io]` shims that only routes time and
# entropy to the existing om_host imports (no wasm-bindgen import reaches the module).
[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "=0.9.0", optional = true, features = ["fork-resolution", "js"] }

[dev-dependencies]
# Test builds enable the test-only providers (never reachable from a normal or wasm build).
om-core = { path = ".", features = ["insecure-test-rng", "test-loopback"] }
proptest = { version = "1", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
