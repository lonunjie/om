name: Suggest an idea
description: Something you wish OM did, or did differently.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas here are public. Please do not paste your messages, your safety code or your password.
  - type: textarea
    id: idea
    attributes:
      label: What would you like OM to do?
      description: Tell us what you are trying to do, not only the feature. Plain words are welcome.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OM version
      description: Filled in for you when you open this from Settings > Help and feedback.
