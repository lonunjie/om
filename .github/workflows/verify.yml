# ADR-0116: every push/PR runs the architecture validator, docs link check, all executable
# evidence and TLC (digest-pinned), then fails if regenerated evidence differs from the commit.
name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      prototypes:
        description: also build and run every verification/prototypes/*/run.sh (slow)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # checkpoint tags are needed for registry immutability
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Cache pinned TLC
        uses: actions/cache@v4
        with:
          path: ~/.cache/om
          key: tla2tools-1.7.4-bee4a54f
      - name: make verify
        run: make verify
      - name: Registry immutability (assigned ids never removed or reused)
        run: python3 tools/continuity_bundle.py check-registries
      - name: Continuity bundle builds and verifies offline
        run: |
          python3 tools/continuity_bundle.py build --out /tmp/bundle
          python3 tools/continuity_bundle.py verify /tmp/bundle/*.tar.gz
      - name: Prototype checks (manual only; each verification/prototypes/*/run.sh)
        if: ${{ inputs.prototypes }}
        run: |
          set -e
          for r in verification/prototypes/*/run.sh; do
            [ -e "$r" ] || continue
            echo "::group::$r"; bash "$r"; echo "::endgroup::"
          done
      - name: Evidence must match the commit
        run: git diff --exit-code -- verification/results verification/vectors verification/GATE_PASS_CRITERIA.md
