# OM engineering workspace (core_kernel, ADR-0169). Layout: docs/process/ENGINEERING_REPOSITORY_LAYOUT.md.
[workspace]
resolver = "3"
members = ["crates/om-codec", "crates/om-core", "crates/om-wasm"]
# Verification prototypes are standalone evidence crates with their own manifests and lockfiles.
exclude = ["verification", "third_party/openmls-wasm-shims/web-time", "third_party/openmls-wasm-shims/getrandom-0.4.3"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MPL-2.0"
publish = false
repository = "https://github.com/lonunjie/om"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
panic = "abort"

# Crypto dependencies are slow unoptimised (ML-DSA/ML-KEM); keep tests quick without touching first-party debug info.
[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2

# ADR-0187 (proposed by delegated draft, not accepted): two plumbing shims so stock OpenMLS 0.9.0 builds into the Core
# wasm module with only the om_host.random_fill and om_host.now_ms imports. No cryptography in either. Both apply only
# where the `groups-openmls` feature is on; revert by deleting these two lines and third_party/openmls-wasm-shims.
[patch.crates-io]
web-time = { path = "third_party/openmls-wasm-shims/web-time" }
getrandom = { path = "third_party/openmls-wasm-shims/getrandom-0.4.3" }
